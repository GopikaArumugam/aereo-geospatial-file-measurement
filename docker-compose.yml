version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aereo-geospatial-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./geospatial.db
      - MAX_FILE_SIZE_MB=50
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
